# Основной конфиг nginx: как в официальном образе, плюс модуль njs для приёма заявок (/api/lead).
load_module modules/ngx_http_js_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Токен бота и чат для заявок задаются в окружении контейнера (Dokploy → Environment).
env TELEGRAM_BOT_TOKEN;
env TELEGRAM_CHAT_ID;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    js_path "/etc/nginx/njs/";
    js_import lead from lead.js;

    # Защита бота от спама: с одного адреса не чаще 5 заявок в минуту, со всего сайта — 30.
    limit_req_zone $binary_remote_addr zone=lead_ip:1m rate=5r/m;
    limit_req_zone $server_name zone=lead_all:64k rate=30r/m;

    include /etc/nginx/conf.d/*.conf;
}
