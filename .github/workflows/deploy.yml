name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (prerender to static HTML)
        run: |
          # Сайт живёт по адресу https://<user>.github.io/<repo>/ — префикс нужен для путей к ассетам.
          # Для своего домена (public/CNAME) задайте переменную репозитория CUSTOM_DOMAIN=true.
          if [ "${{ vars.CUSTOM_DOMAIN }}" != "true" ]; then export BASE_PATH="/${{ github.event.repository.name }}"; fi
          npm run build
        env:
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          NEXT_PUBLIC_TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
