name: Build and publish Docker image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/franch-landing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Сначала собираем образ локально и проверяем nginx: сломанный конфиг не должен попасть в Dokploy.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: franch-landing:test
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_TELEGRAM_URL=${{ vars.TELEGRAM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eu
          lead() { curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:$1/api/lead" -H 'Content-Type: application/json' -d '{"name":"CI","contact":"@ci_test"}'; }
          # Без токена: сайт отдаётся, /api/lead честно отвечает 503.
          docker run -d --name plain -p 8081:8080 franch-landing:test
          # С заведомо неверным токеном: Telegram отвечает 401, значит DNS, TLS и ngx.fetch работают.
          docker run -d --name fake -p 8082:8080 -e TELEGRAM_BOT_TOKEN=123:ci-fake -e TELEGRAM_CHAT_ID=1 franch-landing:test
          sleep 3
          curl -fsS http://localhost:8081/health
          curl -fsS http://localhost:8081/ | grep -qi '<h1'
          test "$(lead 8081)" = 503
          test "$(lead 8082)" = 502
          docker logs fake 2>&1 | grep -q 'telegram answered 401'
      - name: Smoke test logs
        if: failure()
        run: docker logs plain; docker logs fake
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_TELEGRAM_URL=${{ vars.TELEGRAM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_FRANCH_WEBHOOK_URL }}
        run: curl --fail --show-error --silent --retry 2 --retry-delay 2 -X POST "$DOKPLOY_WEBHOOK"
