name: Build and publish Docker image

# main → <user>/franch-landing:latest     → вебхук DOKPLOY_FRANCH_WEBHOOK_URL (прод)
# dev  → <user>/franch-landing-dev:latest → вебхук DOKPLOY_FRANCH_DEV_WEBHOOK_URL (дев)
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/franch-landing${{ github.ref_name == 'dev' && '-dev' || '' }}

jobs:
  build-and-publish:
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_WEB3FORMS_KEY=${{ secrets.WEB3FORMS_KEY }}
            NEXT_PUBLIC_TELEGRAM_URL=${{ vars.TELEGRAM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_WEBHOOK: ${{ github.ref_name == 'main' && secrets.DOKPLOY_FRANCH_WEBHOOK_URL || secrets.DOKPLOY_FRANCH_DEV_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK" ]; then
            echo "::error::Не задан секрет вебхука Dokploy для ветки ${{ github.ref_name }}"
            exit 1
          fi
          curl --fail --show-error --silent --retry 2 --retry-delay 2 -X POST "$DOKPLOY_WEBHOOK"
